name: Build Flutter Web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-static-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Web
        run: |
          flutter build web --release --base-href "/-AS-Grinta-Live-Demo/"
          sed -i 's#<base href="/-AS-Grinta-Live-Demo/">#<base href="./">#' build/web/index.html

      - name: Publish compiled site branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/web
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b site
          git add -A
          git commit -m "Publish Flutter Web demo"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin site
